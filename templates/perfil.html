{% extends "base.html" %}

{% block title %}Mi Perfil{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card card1">
            <div class="card-header text-center">
                <h2 class="mb-0">Mi Perfil</h2>
            </div>
            <div class="card-body">
                <div class="mb-4">
                    <label class="form-label text-dark fw-bold">Correo electrónico</label>
                    <p class="text-dark bg-light p-2 rounded">{{ usuario.correo }}</p>
                </div>
                
                <div class="mb-4">
                    <label class="form-label text-dark fw-bold">Nombre actual</label>
                    <p class="text-dark bg-light p-2 rounded">{{ usuario.username }}</p>
                </div>
                
                <hr>
                
                <h5 class="mb-3">Cambiar nombre</h5>
                <form method="POST" action="/cambiar_nombre">
                    <div class="mb-3">
                        <label class="form-label text-dark">Nuevo nombre</label>
                        <input type="text" class="form-control" name="nuevo_nombre" required minlength="3">
                        <small class="text-muted">Mínimo 3 caracteres</small>
                    </div>
                    <button type="submit" class="btn btn-success w-100">Actualizar nombre</button>
                </form>
            </div>
            <div class="card-footer text-center">
                <a href="/backrooms" class="btn btn-secondary">Volver</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
