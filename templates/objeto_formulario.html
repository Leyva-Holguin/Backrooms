{% extends "base.html" %}

{% block title %}Agregar Objeto{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1>Agregar Nuevo Objeto de Backrooms</h1>
</div>
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card card1">
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label text-white">Numero del objeto *</label>
                        <input type="number" class="form-control" name="numero" placeholder="0" required min="0">
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-white">Nombre del objeto *</label>
                        <input type="text" class="form-control" name="nombre" placeholder="Ej: Agua de almendras" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-white">URL de la imagen</label>
                        <input type="url" class="form-control" name="imagen_url" placeholder="https://picsum.photos/300/200">
                        <small class="text-muted">Usa https://picsum.photos/ para pruebas o ImgBB para tus imagenes</small>
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-white">Descripcion *</label>
                        <textarea class="form-control" name="descripcion" placeholder="Agrega la descripción del objeto" rows="4" required></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-white">Localizacion</label>
                        <input type="text" class="form-control" name="localizacion" placeholder="Ej: Nivel 0, Nivel 1, Todos los niveles">
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-white">Rareza</label>
                        <select class="form-select" name="rareza">
                            <option value="">Seleccionar...</option>
                            <option value="Desconocida">Desconocida</option>   
                            <option value="distribuido">distribuido</option>     
                            <option value="comun">Comun</option>
                            <option value="medianamente comun">Medianamente comun</option>
                            <option value="Poco comun">Poco comun</option>
                            <option value="media">Media</option>       
                            <option value="Raro">Raro</option>
                            <option value="bastante raro">Bastante raro</option>
                            <option value="muy raro">Muy raro</option>
                            <option value="extremadamnete raro">Extremadamnete raro</option>                            
                            <option value="bastante infrecuente">Bastante infrecuente</option>
                            <option value="variable">Variable</option>
                            <option value="Unico">Unico</option>
                            <option value="Inevitable de encontrar">Inevitable de encontrar</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-white">Clase</label>
                        <select class="form-select" name="clase">
                            <option value="">Seleccionar...</option>
                            <option value="positiva">Positivo</option>
                            <option value="Neutra">Neutral</option>
                            <option value="negativo">Negativo</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-white">Obtencion</label>
                        <textarea class="form-control" name="obtencion" rows="2" placeholder="¿Cómo se consigue este objeto?"></textarea>
                    </div>
                    
                    <div class="card mb-3 card3">
                        <div class="card-header drop1 text-white">
                            <h5 class="mb-0">Personalizacion de colores</h5>
                        </div>
                        <div class="card-body">
                            <div class="mb-3">
                                <label class="form-label text-white">Color de fondo (hexadecimal)</label>
                                <input type="text" class="form-control" name="color_fondo" placeholder="#16213e" value="#16213e" pattern="^#[0-9A-Fa-f]{6}$" title="Debe ser un color hexadecimal como #16213e">
                                <small class="text-muted">Ejemplo: #16213e</small>
                            </div>
                            <div class="mb-3">
                                <label class="form-label text-white">Color de los cuadros (hexadecimal)</label>
                                <input type="text" class="form-control" name="color_card" placeholder="#0f3460" value="#0f3460" pattern="^#[0-9A-Fa-f]{6}$" title="Debe ser un color hexadecimal como #0f3460">
                            </div>
                            <div class="mb-3">
                                <label class="form-label text-white">Color del texto (hexadecimal)</label>
                                <input type="text" class="form-control" name="color_texto" placeholder="#ffffff" value="#ffffff" pattern="^#[0-9A-Fa-f]{6}$" title="Debe ser un color hexadecimal como #ffffff">
                            </div>
                        </div>
                    </div>
                    
                    <div class="card mb-3 card3">
                        <div class="card-header drop1 text-light">
                            <h5 class="mb-0">Variaciones (maximo 3)</h5>
                        </div>
                        <div class="card-body">
                            <div class="mb-3">
                                <label class="form-label text-white">Variacion 1 - Nombre</label>
                                <input type="text" class="form-control mb-2" name="variacion1_nombre" placeholder="Ej: Version azul">
                                <label class="form-label text-white">Descripcion</label>
                                <textarea class="form-control" name="variacion1_descripcion" rows="2" placeholder="Describe esta variacion..."></textarea>
                            </div>
                            <div class="mb-3">
                                <label class="form-label text-white">Variacion 2 - Nombre</label>
                                <input type="text" class="form-control mb-2" name="variacion2_nombre" placeholder="Ej: Version roja">
                                <label class="form-label text-white">Descripcion</label>
                                <textarea class="form-control" name="variacion2_descripcion" rows="2" placeholder="Describe esta variacion..."></textarea>
                            </div>
                            <div class="mb-3">
                                <label class="form-label text-white">Variacion 3 - Nombre</label>
                                <input type="text" class="form-control mb-2" name="variacion3_nombre" placeholder="Ej: Version oxidada">
                                <label class="form-label text-white">Descripcion</label>
                                <textarea class="form-control" name="variacion3_descripcion" rows="2" placeholder="Describe esta variacion..."></textarea>
                            </div>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-success">Guardar Objeto</button>
                    <a href="/objetos" class="btn btn-secondary">Cancelar</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
